spring:
  application:
    name: rizenfood-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/rizenfood}
    username: ${DB_USERNAME:rizen}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 스키마는 Flyway 가 관리한다. Hibernate 가 테이블을 건드리면 안 된다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  # 응답 헤더에서 서버 종류를 감춘다.
  server-header:
  error:
    # 예외 스택트레이스를 클라이언트에 노출하지 않는다.
    include-stacktrace: never
    include-message: never

spring.servlet.multipart:
  # 업로드 한 건의 상한. app.image.max-file-size-bytes 보다 커야 검증 메시지가 제대로 나간다.
  max-file-size: 12MB
  max-request-size: 60MB

app:
  jwt:
    # ★ .env 의 JWT_SECRET 으로만 넣는다. 저장소에 들어가면 누구나 토큰을 위조할 수 있다.
    #   32바이트 이상이어야 하고, 짧으면 서버가 아예 뜨지 않는다.
    secret: ${JWT_SECRET:}
    admin-expiry-minutes: 240
    member-access-minutes: 30
    member-refresh-days: 14
    # 운영은 반드시 true. HTTPS 로만 쿠키가 오간다.
    secure-cookie: ${JWT_SECURE_COOKIE:false}
    same-site: Lax

  admin:
    bootstrap:
      # 관리자 계정이 하나도 없을 때만 이 값으로 첫 계정을 만든다.
      # 비어 있으면 아무것도 하지 않는다. 운영에서는 첫 기동 후 값을 지운다.
      username: ${ADMIN_BOOTSTRAP_USERNAME:}
      password: ${ADMIN_BOOTSTRAP_PASSWORD:}
      display-name: ${ADMIN_BOOTSTRAP_NAME:관리자}

  crypto:
    # 휴대폰 번호 암호화 키 (base64 32바이트). .env 로만 넣는다.
    phone-key: ${PHONE_ENC_KEY:}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  image:
    max-file-size-bytes: 10485760   # 10MB
    # 압축 폭탄 방지. 파일은 작아도 풀면 수억 픽셀이 되는 파일을 막는다.
    max-pixels: 50000000
    webp-quality: 0.82

  storage:
    # local | s3
    type: ${STORAGE_TYPE:local}
    local:
      path: ${STORAGE_LOCAL_PATH:./uploads}
      public-base-url: ${STORAGE_LOCAL_URL:http://localhost:8080/uploads}
    s3:
      bucket: ${S3_BUCKET:}
      # 버킷 주소가 아니라 CloudFront 도메인을 쓴다.
      public-base-url: ${CDN_BASE_URL:}
