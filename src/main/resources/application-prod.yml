# 운영 프로필 (SPRING_PROFILES_ACTIVE=prod)
#
# 값 대부분은 서버의 .env 에서 온다(deploy/.env.example 참고).
# 여기에는 "운영이면 반드시 이래야 하는 것"과 운영 구성(Lightsail 한 대)에 맞는 기본값만 둔다.

spring:
  datasource:
    hikari:
      # DB 는 같은 서버의 PostgreSQL(max_connections=20, 2GB 서버). 5 면 충분하다.
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: 1
      connection-timeout: 10000
  jpa:
    properties:
      hibernate:
        format_sql: false
  lifecycle:
    # 재배포·재시작 때 처리 중인 요청(결제 확정 등)을 마치고 내려간다.
    timeout-per-shutdown-phase: 20s

server:
  shutdown: graceful
  tomcat:
    # 2GB 서버 기준. 요청이 몰리면 대기열에서 기다리게 하고 메모리를 지킨다.
    threads:
      max: 50
    accept-count: 100

app:
  jwt:
    # 운영은 HTTPS 로만 쿠키가 오간다. 환경변수로 끌 수 없게 고정한다.
    secure-cookie: true
  client-ip:
    # Caddy 가 실제 연결 주소로 덮어쓰는 헤더 (deploy/Caddyfile). 손님이 보낸 값은 남지 않는다.
    header: ${CLIENT_IP_HEADER:X-Real-IP}
  storage:
    # 사진은 서버 디스크에 두고 Caddy 가 /uploads 로 서빙한다.
    type: ${STORAGE_TYPE:local}

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
