# 테스트 전용 설정.
# 데이터소스는 각 통합 테스트가 @ServiceConnection(Testcontainers)로 주입하므로 여기 없다.
# 기동에 필요한 비밀값만 테스트용 더미로 채운다(실값 아님).
app:
  jwt:
    secret: "test-secret-please-change-this-32bytes-minimum-abcdef"
  crypto:
    # base64 of 32 bytes ("0"*32) — AES-256 키 길이 요건 충족용 더미.
    phone-key: "MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMA=="
  cors:
    allowed-origins: "http://localhost:3000"
  admin:
    bootstrap:
      username: ""
      password: ""
