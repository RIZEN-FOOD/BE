# API 서버 Docker 이미지를 x86(Lightsail)용으로 빌드해 GitHub 패키지(ghcr.io)에 올린다.
#
# 지금은 수동 실행만 연다(Actions 탭 → Run workflow). 서버가 준비되면 main 푸시 자동 빌드와
# 서버 반영 단계를 붙인다.
#
# 서버에서 받을 때: 이 저장소가 비공개면 패키지도 비공개다.
#   서버에서 `docker login ghcr.io` (read:packages 권한 토큰) 후 docker compose pull.
name: Build API image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name (소문자)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
